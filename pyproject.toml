[tool.ruff]
target-version = "py311"
exclude = ["app/migrations"]

[tool.ruff.lint]
extend-select = [
    "SIM105",  # Use contextlib.suppress() instead of try-except-pass
    "S110",    # try-except-pass: silently swallows exceptions
]
ignore = [
    # flake8-datetimez (DTZ*): this codebase deliberately uses naive
    # local-server date/datetime (date.today(), datetime.now(),
    # datetime.strptime() without tzinfo) throughout business logic —
    # pilot currency windows, maintenance due-dates, backup scheduling,
    # anniversary banners — where "today"/"now" means the server's local
    # calendar day, not a UTC instant. ruff 0.16 enabled this family by
    # default; it touches 40+ files including currency.py and
    # maintenance/routes.py. Forcing timezone-aware datetimes there is a
    # genuine business-logic decision (which day a UTC-vs-local boundary
    # falls on) that needs deliberate per-call-site review, not a
    # mechanical lint fixup.
    "DTZ",
]

[tool.ruff.lint.per-file-ignores]
# conftest files set os.environ before importing app code — E402 is intentional
"tests/conftest.py" = ["E402"]
"tests/e2e/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["app/tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "app"
explicit_package_bases = true
ignore_missing_imports = true
strict = true

# Flask-SQLAlchemy dynamic ORM base (db.Model) and SQLAlchemy relationship
# attributes are not resolvable without Mapped[] annotations — suppress until
# models are migrated to the typed declarative style.
[[tool.mypy.overrides]]
module = ["models", "_seed_helpers", "reservations.routes"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true
