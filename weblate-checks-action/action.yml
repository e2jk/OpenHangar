name: 'Weblate Quality Checks to SARIF'
description: >-
  Fetch strings flagged by Weblate's translation quality checks and convert
  them into a SARIF file, ready to upload to GitHub Code Scanning.
author: 'e2jk'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  weblate-url:
    description: 'Base URL of the Weblate instance.'
    required: false
    default: 'https://hosted.weblate.org'
  project:
    description: 'Weblate project slug.'
    required: true
  component:
    description: 'Weblate component slug.'
    required: true
  languages:
    description: >-
      Comma-separated language codes to check, e.g. "en,fr,nl". Leave empty
      (the default) to auto-discover every language configured for the
      component from Weblate itself — this already includes the source
      language, since Weblate runs checks against it too (e.g. two distinct
      English strings translated identically elsewhere is flagged as "Reused
      translation" on the English unit itself). Set this explicitly if your
      project has its own authoritative list of supported languages that
      may differ from what's configured in Weblate.
    required: false
    default: ''
  token:
    description: >-
      Weblate API token. Optional, but raises the rate limit from 100
      requests/day (anonymous) to 5000/hour — recommended for scheduled
      runs. Create one at <weblate-url>/accounts/profile/#api and store it
      as a repository secret.
    required: false
    default: ''
  output:
    description: 'Path to write the generated SARIF file to.'
    required: false
    default: 'weblate-checks.sarif'
  delay:
    description: >-
      Seconds to sleep between per-string page fetches (politeness delay
      against the Weblate instance; one fetch happens per flagged string).
    required: false
    default: '0.3'
  warning-checks:
    description: >-
      Comma-separated Weblate check names that should map to SARIF
      "warning" instead of "note". The default covers checks that mean a
      translation is malformed at render time (mismatched placeholders,
      line breaks, XML markup); everything else maps to "note" so Weblate
      findings never outrank real security findings (CodeQL, etc.) in the
      same Code Scanning list.
    required: false
    default: >-
      Mismatching line breaks,Python format,Python brace format,C
      format,C# format,JavaScript format,Perl format,PHP format,XML
      markup,XML tags,XML syntax
  verbose:
    description: 'Log each flagged string and its detected check name(s) as they are fetched.'
    required: false
    default: 'false'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file (same as the `output` input).'
    value: ${{ inputs.output }}
  flagged-count:
    description: 'Number of distinct strings with at least one failing check.'
    value: ${{ steps.run.outputs.flagged-count }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Run Weblate quality checks and convert to SARIF
      id: run
      shell: bash
      env:
        WEBLATE_API_TOKEN: ${{ inputs.token }}
        INPUT_WEBLATE_URL: ${{ inputs.weblate-url }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_LANGUAGES: ${{ inputs.languages }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_DELAY: ${{ inputs.delay }}
        INPUT_WARNING_CHECKS: ${{ inputs.warning-checks }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -eu
        args=(
          --weblate-url "$INPUT_WEBLATE_URL"
          --project "$INPUT_PROJECT"
          --component "$INPUT_COMPONENT"
          --output "$INPUT_OUTPUT"
          --delay "$INPUT_DELAY"
          --warning-checks "$INPUT_WARNING_CHECKS"
        )
        if [ -n "$INPUT_LANGUAGES" ]; then
          args+=(--languages "$INPUT_LANGUAGES")
        fi
        if [ "$INPUT_VERBOSE" = "true" ]; then
          args+=(--verbose)
        fi
        python3 "$ACTION_PATH/weblate_checks_to_sarif.py" "${args[@]}"
