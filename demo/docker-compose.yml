networks:
  # Must already exist on the VPS: sudo docker network create traefik-network
  traefik-network:
    external: true
  # The demo database is reachable from the demo web container only, not
  # from Traefik or the other containers on traefik-network.
  demo-backend:
    internal: true

services:
  openhangar-demo-db:
    image: ${OPENHANGAR_POSTGRES_IMAGE_TAG:-postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71}
    container_name: openhangar-demo-db
    hostname: ${OPENHANGAR_DEMO_DB_HOSTNAME:-openhangar-demo-db}
    environment:
      POSTGRES_DB: ${OPENHANGAR_DEMO_POSTGRES_DB}
      POSTGRES_USER: ${OPENHANGAR_DEMO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OPENHANGAR_DEMO_POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ images: mount /var/lib/postgresql, not .../data
      - ./openhangar-demo/postgres_data:/var/lib/postgresql
    networks:
      - demo-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENHANGAR_DEMO_POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  openhangar-demo-web:
    image: ${OPENHANGAR_DEMO_IMAGE:-ghcr.io/e2jk/openhangar:latest}
    container_name: ${OPENHANGAR_DEMO_WEB_CONTAINER:-openhangar-demo-web}
    networks:
      - traefik-network
      - demo-backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openhangar-demo.rule=Host(`${OPENHANGAR_DEMO_HOSTNAME}`)"
      - "traefik.http.routers.openhangar-demo.service=openhangar-demo"
      - "traefik.http.routers.openhangar-demo.entrypoints=websecure"
      - "traefik.http.routers.openhangar-demo.tls=true"
      - "traefik.http.routers.openhangar-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.openhangar-demo.loadbalancer.server.port=5000"
      - "traefik.http.services.openhangar-demo.loadbalancer.passhostheader=true"
      # demo-ratelimit was defined below but never attached to the router.
      - "traefik.http.routers.openhangar-demo.middlewares=compresstraefik-demo,demo-ratelimit"
      - "traefik.http.middlewares.compresstraefik-demo.compress=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.middlewares.demo-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.demo-ratelimit.ratelimit.burst=20"
    environment:
      - OPENHANGAR_DATABASE_URL=postgresql://${OPENHANGAR_DEMO_POSTGRES_USER}:${OPENHANGAR_DEMO_POSTGRES_PASSWORD}@${OPENHANGAR_DEMO_DB_HOSTNAME:-openhangar-demo-db}:5432/${OPENHANGAR_DEMO_POSTGRES_DB}
      - OPENHANGAR_DB_HOST=${OPENHANGAR_DEMO_DB_HOSTNAME:-openhangar-demo-db}
      - OPENHANGAR_ENV=demo
      - OPENHANGAR_SECRET_KEY=${OPENHANGAR_DEMO_SECRET_KEY}
      - OPENHANGAR_DEMO_SLOT_COUNT=${OPENHANGAR_DEMO_SLOT_COUNT:-20}
      - OPENHANGAR_DEMO_NEXT_WIPE_UTC=${OPENHANGAR_DEMO_NEXT_WIPE_UTC:-}
      # Optional: OpenAIP API key for aviation map tiles (uncomment and set in .env):
      # - OPENHANGAR_OPENAIP_API_KEY=${OPENHANGAR_OPENAIP_API_KEY}
    volumes:
      - ./openhangar-demo/uploads:/data/uploads
      - ./openhangar-demo/backups:/data/backups
    depends_on:
      openhangar-demo-db:
        condition: service_healthy
    restart: unless-stopped
