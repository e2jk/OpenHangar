# OpenHangar — Raspberry Pi / home-network setup
#
# HOW TO USE
# ----------
# 1. Generate three random secrets and put them in this file:
#
#      openssl rand -hex 20   # → paste as POSTGRES_PASSWORD
#      openssl rand -hex 32   # → paste as OPENHANGAR_SECRET_KEY
#      openssl rand -hex 32   # → paste as OPENHANGAR_BACKUP_ENCRYPTION_KEY
#
# 2. Find the three lines marked  ← CHANGE THIS  and replace the
#    placeholder value with the string you just generated.
#
# 3. Start OpenHangar:
#
#      docker compose -f docker-compose.raspberry-pi.yml up -d
#
# 4. Open http://openhangar.local:8087  (or http://raspberrypi.local:8087 if you
#    kept the default hostname, or http://<pi-ip-address>:8087 as a fallback)
#    in any browser on your network and follow the setup wizard.
#
# UPDATES
# -------
#      docker compose -f docker-compose.raspberry-pi.yml pull
#      docker compose -f docker-compose.raspberry-pi.yml up -d
#
# BACKUP
# ------
#      docker compose -f docker-compose.raspberry-pi.yml exec web flask backup-now
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openhangar
      POSTGRES_USER: openhangar
      POSTGRES_PASSWORD: "CHANGE_THIS_db_password"        # ← CHANGE THIS
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql
      # (data lives in a version-specific subfolder, e.g. 18/docker) and
      # refuse to start with the pre-18 /var/lib/postgresql/data mount.
      - ./db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhangar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── OpenHangar web application ───────────────────────────────────────────────
  web:
    image: ghcr.io/e2jk/openhangar:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      - OPENHANGAR_DATABASE_URL=postgresql://openhangar:CHANGE_THIS_db_password@db:5432/openhangar
      - OPENHANGAR_ENV=production
      # Direct LAN access: client-supplied forwarding headers are untrusted.
      - OPENHANGAR_PROXY_HOPS=0
      # Optional: include every actual hostname/LAN IP used by your devices.
      # - OPENHANGAR_TRUSTED_HOSTS=openhangar.local,raspberrypi.local,192.168.1.50,localhost,127.0.0.1
      - OPENHANGAR_SECRET_KEY=CHANGE_THIS_secret_key_min_32_chars     # ← CHANGE THIS
      - OPENHANGAR_BACKUP_ENCRYPTION_KEY=CHANGE_THIS_backup_enc_key  # ← CHANGE THIS
      # This setup is reached over plain http:// on your home network.
      # Browsers refuse to send a "Secure" session cookie over plain HTTP, so
      # without this line login and the setup wizard loop back with a 400
      # error. Remove it (or set it to true) if you later put OpenHangar
      # behind HTTPS — see docs/configuration.md#openhangar_session_cookie_secure.
      - OPENHANGAR_SESSION_COOKIE_SECURE=false
      # No worker/thread override needed here: the default (1 worker process
      # × 4 threads, see docs/configuration.md#openhangar_web_workers) is
      # already a single-process footprint, which fits a 1-2 GB Raspberry Pi
      # fine.
    volumes:
      - ./uploads:/data/uploads
      - ./backups:/data/backups
    ports:
      # Left side (8087) = port on your Pi / network.
      # Right side (5000) = internal port inside the container (do not change).
      - "8087:5000"
    restart: unless-stopped

