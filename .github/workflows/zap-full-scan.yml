name: ZAP full (active) scan

# The ZAP baseline scan in ci.yml's docker-validate job is passive-only — it
# never actively probes for injection, traversal, etc. This workflow builds
# the image from HEAD (more relevant than pulling :latest) and runs a full
# active scan against it on a weekly schedule, since active scans are slow
# and too disruptive to run on every push/PR.
#
# Two kinds of target: the public demo, signed out (zap-full-scan), and a
# disposable production-mode instance seeded with fake data, scanned signed
# in as the admin and as a limited pilot (zap-authenticated-scan). The
# latter proves afterwards that its session survived the scan and that
# signed-in pages were reached; see .zap/rules-authenticated.tsv.

on:
  schedule:
    - cron: '14 3 * * 3'   # Wednesday 03:14 UTC — off-peak, distinct from CodeQL (Mon 09:23) and Scorecard (Mon 11:41)
  workflow_dispatch: {}     # allow manual runs for testing

permissions: read-all  # zizmor: ignore[excessive-permissions] intentional: workflow default is read-only, the job below opts into exactly the write scopes it needs

concurrency:
  group: zap-full-scan
  cancel-in-progress: true

jobs:
  zap-full-scan:
    name: Build image and run ZAP full active scan
    runs-on: ubuntu-26.04
    timeout-minutes: 90   # active scans are slow
    permissions:
      security-events: write  # ZAP SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (linux/amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t openhangar:ci \
            --load .

      - name: Smoke-test Docker image (demo mode)
        env:
          SMOKE_DB: smoke-db
          SMOKE_DB_NAME: smokedb
          SMOKE_DB_USER: smokeuser
          SMOKE_DB_PASS: smokepass
          SMOKE_WEB: smoke-web
        run: |
          docker network create smoke-net
          docker run -d --name "$SMOKE_DB" --network smoke-net \
            -e POSTGRES_DB="$SMOKE_DB_NAME" \
            -e POSTGRES_USER="$SMOKE_DB_USER" \
            -e POSTGRES_PASSWORD="$SMOKE_DB_PASS" \
            postgres:18-alpine

          docker run -d --name "$SMOKE_WEB" --network smoke-net \
            -p 5001:5000 \
            -e OPENHANGAR_DATABASE_URL="postgresql://$SMOKE_DB_USER:$SMOKE_DB_PASS@$SMOKE_DB:5432/$SMOKE_DB_NAME" \
            -e OPENHANGAR_DB_HOST="$SMOKE_DB" \
            -e OPENHANGAR_ENV=demo \
            -e OPENHANGAR_SECRET_KEY=smoke-ci-secret-not-for-production-use-only \
            openhangar:ci

          echo "Waiting up to 120 s for $SMOKE_WEB to become healthy..."
          start=$SECONDS
          deadline=$((start + 120))
          while [ $SECONDS -lt $deadline ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$SMOKE_WEB")
            echo "  [t+$((SECONDS - start))s] health=${status}"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done

          final=$(docker inspect --format='{{.State.Health.Status}}' "$SMOKE_WEB")
          if [ "$final" != "healthy" ]; then
            echo "::error::$SMOKE_WEB did not become healthy within 120 s (final status: ${final})"
            echo "=== $SMOKE_WEB logs ==="
            docker logs "$SMOKE_WEB"
            exit 1
          fi
          echo "Smoke test passed — container is healthy."

      - name: OWASP ZAP full (active) scan
        # Suppressions for known false positives are in .zap/rules.tsv, shared
        # with the passive baseline scan in ci.yml.
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5001'
          rules_file_name: '.zap/rules.tsv'
          fail_action: 'true'
          allow_issue_writing: 'false'
          artifact_name: zap-full-scan-results

      - name: Convert ZAP JSON report to SARIF
        if: always() && hashFiles('report_json.json') != ''
        run: python3 .github/scripts/zap_to_sarif.py report_json.json zap-full-results.sarif .zap/rules.tsv "ZAP Full Scan"

      - name: Upload ZAP SARIF to GitHub Security tab
        if: always() && hashFiles('zap-full-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: zap-full-results.sarif
          category: zap-full

  zap-authenticated-scan:
    # The scan above only reaches what a signed-out visitor sees in demo mode.
    # This one signs a real user in on a disposable, production-mode instance
    # seeded with the fake development data (dev_seed.py), and scans with
    # that session: the owner/admin surface and a limited pilot separately.
    # Never point it at an operator's live instance.
    name: ZAP authenticated scan (${{ matrix.user }})
    runs-on: ubuntu-26.04
    timeout-minutes: 135  # setup ~2 + crawls (10 + up to 20 min) + 90 min attack + report
    permissions:
      security-events: write  # ZAP SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - user: admin
            email: admin@openhangar.dev
            password: openhangar-dev-1
            totp: JBSWY3DPEHPK3PXP  # fixed dev-seed secret, not a credential
            evidence: '^/config/$ ^/config/users/$ ^/aircraft/[A-Z0-9-]+/expenses$'
            aircraft: 'OO-PNH OO-ABC OO-GRN OO-TCH'  # the dev seed's fleet
            # Browser crawl: minutes, and the pages it may start from ({reg}
            # = this run's aircraft). The admin's crawl only got through ~9%
            # of its queue in 10 min, so it gets 20 (the job then still ends
            # well inside its limit: the admin leg took 71 of 135 min).
            browser_minutes: 20
            browser_entries: >-
              / /aircraft/ /aircraft/{reg} /aircraft/{reg}/maintenance
              /aircraft/{reg}/airworthiness/ /aircraft/{reg}/documents
              /aircraft/{reg}/expenses /aircraft/{reg}/reservations/
              /aircraft/{reg}/snags /aircraft/{reg}/wb/ /config/ /config/users/
              /config/renters/ /flights /maintenance /reservations/fleet/
              /pilot/logbook /pilot/minimums
          - user: pilot
            email: pilot@openhangar.dev
            password: openhangar-dev-3
            totp: ''
            evidence: '^/pilot/logbook$ ^/flights$ ^/pilot/profile$'
            aircraft: 'OO-PNH OO-ABC'  # the two the seeded pilot may fly
            browser_minutes: 10  # the pilot's crawl finishes within 10 min
            browser_entries: >-
              / /aircraft/{reg} /aircraft/{reg}/reservations/
              /aircraft/{reg}/snags /flights /reservations/fleet/
              /pilot/logbook /pilot/profile /pilot/minimums /pilot/tracks
              /pilot/stats
    env:
      ZAP_DB: zap-db
      ZAP_WEB: zap-web
      ZAP_DB_URL: postgresql://zapuser:zappass@zap-db:5432/zapdb
      ZAP_SECRET: zap-ci-secret-not-for-production-use-only-0123456789
      BASE_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (linux/amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t openhangar:ci \
            --load .

      - name: Start a disposable, seeded, production-mode instance
        run: |
          docker network create zap-net
          docker run -d --name "$ZAP_DB" --network zap-net \
            -e POSTGRES_DB=zapdb -e POSTGRES_USER=zapuser -e POSTGRES_PASSWORD=zappass \
            postgres:18-alpine
          until docker exec "$ZAP_DB" pg_isready -U zapuser >/dev/null 2>&1; do sleep 1; done
          # Seed once in development mode (dev_seed refuses production), then
          # serve the same database in production mode.
          docker run --rm --network zap-net --entrypoint python \
            -e OPENHANGAR_DATABASE_URL="$ZAP_DB_URL" -e OPENHANGAR_DB_HOST="$ZAP_DB" \
            -e OPENHANGAR_ENV=development \
            -e OPENHANGAR_SECRET_KEY="$ZAP_SECRET" \
            openhangar:ci docker-init-db.py
          docker run -d --name "$ZAP_WEB" --network zap-net -p 5001:5000 \
            -e OPENHANGAR_DATABASE_URL="$ZAP_DB_URL" -e OPENHANGAR_DB_HOST="$ZAP_DB" \
            -e OPENHANGAR_ENV=production -e OPENHANGAR_SECRET_KEY="$ZAP_SECRET" \
            -e OPENHANGAR_PROXY_HOPS=0 -e OPENHANGAR_ACCESS_LOG=1 \
            -e OPENHANGAR_WEB_WORKERS=2 \
            openhangar:ci
          for _ in $(seq 120); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' "$ZAP_WEB")" = healthy ] && exit 0
            sleep 1
          done
          docker logs "$ZAP_WEB"
          exit 1

      - name: Sign the scan user in
        env:
          USER_EMAIL: ${{ matrix.email }}
          USER_PASSWORD: ${{ matrix.password }}
          USER_TOTP: ${{ matrix.totp }}
        run: |
          cookie=$(python3 .github/scripts/zap_auth_session.py login "$BASE_URL" "$USER_EMAIL" "$USER_PASSWORD" "$USER_TOTP")
          echo "::add-mask::${cookie#session=}"
          echo "ZAP_COOKIE=$cookie" >> "$GITHUB_ENV"

      - name: Pick this run's sample (one aircraft, one last ID digit, a browser start page)
        # Every aircraft has the same pages, and every flight, logbook entry
        # and reservation the same few: scanning them all multiplied the
        # work by four, then by ten, for the same code. Each run scans one
        # aircraft and the IDs ending in one digit; both move on with the run
        # number, so successive weekly runs cover the rest of the data.
        # The browser crawl cannot cover everything in its time either, and
        # it starts from the home page, so it would always cover the same
        # part. Each run it starts from a page picked at random instead
        # (written to the summary), read by .zap/scan_hook.py from
        # zap-client-spider.json. A page that does not answer 200 for this
        # user falls back to the home page.
        env:
          AIRCRAFT: ${{ matrix.aircraft }}
          RUN: ${{ github.run_number }}
          BROWSER_MINUTES: ${{ matrix.browser_minutes }}
          BROWSER_ENTRIES: ${{ matrix.browser_entries }}
        run: |
          read -ra regs <<< "$AIRCRAFT"
          keep=${regs[RUN % ${#regs[@]}]}
          digit=$((RUN % 10))
          others=$(printf '%s\n' "${regs[@]}" | grep -vxF "$keep" | paste -sd '|')
          other_digits=$(printf '%s' 0123456789 | tr -d "$digit")
          echo "Scanning aircraft $keep and IDs ending in $digit" | tee -a "$GITHUB_STEP_SUMMARY"
          # Also by id: the browser crawl reaches /aircraft/<id>/..., the same pages.
          echo "ZAP_SKIP_AIRCRAFT=^https?://[^/]+/aircraft/($others|[0-9]+)([/?#].*)?\$" >> "$GITHUB_ENV"
          echo "ZAP_SKIP_IDS=^https?://[^/]+/(.*/)?(flights|logbook|reservations)/[0-9]*[$other_digits]([/?#].*)?\$" >> "$GITHUB_ENV"
          read -ra entries <<< "$BROWSER_ENTRIES"
          entry=${entries[RANDOM % ${#entries[@]}]}
          entry=${entry//\{reg\}/$keep}
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $ZAP_COOKIE" "$BASE_URL$entry")
          if [ "$status" != 200 ]; then
            echo "::warning::browser start page $entry answered $status, starting from / instead"
            entry=/
          fi
          echo "Browser crawl: $BROWSER_MINUTES min from $entry" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -n --arg url "$BASE_URL$entry" --argjson minutes "$BROWSER_MINUTES" \
            '{url: $url, minutes: $minutes}' > zap-client-spider.json

      - name: OWASP ZAP full (active) scan, signed in
        # The session cookie is added to every request (replacer rule).
        # Logout and the account-security pages are excluded: they would end
        # or renew the very session being scanned with. Only the account page
        # itself (/profile at the root) — not /pilot/profile.
        # Time: signed in, the crawl finds hundreds of pages (650 for the
        # admin on the first run), and an unbounded active scan of them all
        # ran into the job's 2 h limit without writing a report. The attack
        # phase is capped at 90 min and each rule at 5, so a report is always
        # produced (setup ~2 + crawls <=30 + 90 + report stays under 135); 4 scanner threads against 2 web workers fit more of the
        # surface in that time. The second run reached only ~9% of its checks
        # in 17 min, so generated downloads are left out too (url 3 and 4):
        # track GIF/PNG renders, ZIP bundles, PDF/CSV/AMP exports — slow to
        # build, binary, and their access rules are covered by the test
        # suite's role sweeps. Plain file serving (uploads, GPS files,
        # photos) stays in: it is fast, and worth path-traversal checks.
        # The language/theme switches are left out too (url 5): every page
        # links to six of them with ?next=<that page>, so they made up ~70%
        # of a local signed-in crawl's requests and multiplied the attack
        # phase's work. Their off-site redirect guard has its own tests
        # (tests/test_i18n.py, test_query_values_not_echoed.py).
        # Even so, the third run still reached only ~40%: most rules ran
        # into their 5 min cap on ~1,400 pages (admin). Most of those were
        # the same pages for each aircraft and each flight, logbook entry or
        # reservation, so only a rotating sample is scanned (url 6 and 7,
        # from the step above): about a quarter of the pages.
        # -j: after the link-following spider, the browser-based crawler
        # (Client Spider, headless Firefox) clicks through the pages too, and
        # reaches what only JavaScript links to: its first trial
        # (zap-browser-crawl.yml) found the offline JSON API and the pages
        # the aircraft page prefetches — two of which a pilot could read
        # but should not have. The browser does not honour the exclusions
        # the way the spiders do, so replacer rule 1 turns its sign-out
        # request into the health check. It adds up to 10 (pilot) or 20
        # (admin) min to the crawl, from a random start page (sample step).
        # -d: without it the scan script prints nothing until it ends (the
        # first run's log was silent for 2 h); with it, crawl and "Active
        # Scan progress %" lines stream into this step's live log. The hook
        # (.zap/scan_hook.py) drops the HTTP library's lines behind each 5 s
        # progress poll, which -d would otherwise also print, and sets the
        # browser crawl's start page and minutes.
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5001/'
          rules_file_name: '.zap/rules-authenticated.tsv'
          fail_action: 'true'
          allow_issue_writing: 'false'
          artifact_name: zap-authenticated-${{ matrix.user }}
          cmd_options: >-
            -j -m 10 -d --hook=/zap/wrk/.zap/scan_hook.py
            -z "-config replacer.full_list(0).description=session
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Cookie
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=${{ env.ZAP_COOKIE }}
            -config replacer.full_list(1).description=keep-signed-in
            -config replacer.full_list(1).enabled=true
            -config replacer.full_list(1).matchtype=REQ_HEADER_STR
            -config replacer.full_list(1).matchstr=/logout HTTP/
            -config replacer.full_list(1).regex=false
            -config replacer.full_list(1).replacement=/health HTTP/
            -config globalexcludeurl.url_list.url(0).regex=.*/logout.*
            -config globalexcludeurl.url_list.url(0).enabled=true
            -config globalexcludeurl.url_list.url(1).regex=^https?://[^/]+/profile([?#].*)?$
            -config globalexcludeurl.url_list.url(1).enabled=true
            -config globalexcludeurl.url_list.url(2).regex=.*/reset-password/.*
            -config globalexcludeurl.url_list.url(2).enabled=true
            -config globalexcludeurl.url_list.url(3).regex=^https?://[^/]+/.*\.(gif|png|zip|csv|pdf)([?#].*)?$
            -config globalexcludeurl.url_list.url(3).enabled=true
            -config globalexcludeurl.url_list.url(4).regex=^https?://[^/]+/.*/(download-all|amp/export(/pdf)?)([?#].*)?$
            -config globalexcludeurl.url_list.url(4).enabled=true
            -config globalexcludeurl.url_list.url(5).regex=^https?://[^/]+/set-(language|theme)/.*
            -config globalexcludeurl.url_list.url(5).enabled=true
            -config globalexcludeurl.url_list.url(6).regex=${{ env.ZAP_SKIP_AIRCRAFT }}
            -config globalexcludeurl.url_list.url(6).enabled=true
            -config globalexcludeurl.url_list.url(7).regex=${{ env.ZAP_SKIP_IDS }}
            -config globalexcludeurl.url_list.url(7).enabled=true
            -config scanner.maxScanDurationInMins=90
            -config scanner.maxRuleDurationInMins=5
            -config scanner.threadPerHost=4"

      - name: Prove the scan stayed signed in and reached signed-in pages
        if: always()
        env:
          EVIDENCE: ${{ matrix.evidence }}
        run: |
          python3 .github/scripts/zap_auth_session.py verify "$BASE_URL" "$ZAP_COOKIE"
          docker logs "$ZAP_WEB" 2>&1 | grep -oE '"GET [^ ]+ HTTP/1.1" 200' \
            | sed -E 's/"GET ([^ ?]+).*/\1/' | sort -u > reached.txt
          echo "Distinct signed-in pages answered 200: $(wc -l < reached.txt)"
          missing=0
          for pattern in $EVIDENCE; do
            if grep -qE "$pattern" reached.txt; then echo "reached: $pattern"
            else echo "::error::the scan never reached $pattern"; missing=1; fi
          done
          exit "$missing"

      - name: Convert ZAP JSON report to SARIF
        if: always() && hashFiles('report_json.json') != ''
        env:
          SCAN_USER: ${{ matrix.user }}
        run: python3 .github/scripts/zap_to_sarif.py report_json.json zap-auth-results.sarif .zap/rules-authenticated.tsv "ZAP Authenticated Scan ($SCAN_USER)"

      - name: Upload ZAP SARIF to GitHub Security tab
        if: always() && hashFiles('zap-auth-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: zap-auth-results.sarif
          category: zap-authenticated-${{ matrix.user }}

      - name: Remove the disposable instance
        if: always()
        run: |
          docker rm -f "$ZAP_WEB" "$ZAP_DB" >/dev/null 2>&1 || true
          docker network rm zap-net >/dev/null 2>&1 || true
