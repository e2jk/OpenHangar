name: Weblate translation quality scan

# Surfaces strings flagged by Weblate's quality checks (Reused translation,
# Mismatching line breaks, Python format, ...) as GitHub Code Scanning
# alerts, via e2jk/weblate-checks-action (https://github.com/e2jk/weblate-checks-action)
# — a project-agnostic composite action originally developed here and later
# split into its own repository; see its README for background. This
# workflow is its reference-implementation consumer.
#
# Informational only: never fails the build. Weblate's own pull-from-GitHub
# sync timing isn't controlled by us, so this is schedule + workflow_dispatch
# only — a push-triggered scan could easily show a just-fixed string as still
# flagged, which is more confusing than no automation.

on:
  schedule:
    - cron: '52 5 * * *'   # daily, 05:52 UTC — off-peak, distinct from the other scheduled scans
  workflow_dispatch: {}     # allow manual runs for testing

permissions: read-all  # zizmor: ignore[excessive-permissions] intentional: workflow default is read-only, the job below opts into exactly the write scopes it needs

concurrency:
  group: weblate-i18n-scan
  cancel-in-progress: true

jobs:
  weblate-scan:
    name: Weblate quality checks -> SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write  # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # needed to look back over .po history below

      # Skip the scan entirely when no .po file has changed in the last 2
      # days: Weblate's own findings can't have moved either, so polling it
      # again is a wasted API call. The 2-day (not 1-day) window is
      # deliberate slack for timing edge cases — e.g. a .po change landing
      # late in the day, just before this runs. Checked against actual .po
      # content, not "any commit in the last 2 days" — a run of unrelated
      # dependency-bump commits shouldn't trigger a scan.
      - name: Check for recent .po file changes
        id: po-check
        run: |
          if git log --since="2 days ago" --oneline -- 'app/translations/*/LC_MESSAGES/messages.po' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .po file changes in the last 2 days — skipping Weblate scan."
          fi

      # The action can auto-discover languages straight from Weblate, but we
      # deliberately pass an explicit list here: SUPPORTED_LOCALES is our own
      # authoritative "does the app actually support this locale" answer,
      # which isn't guaranteed to match whatever happens to be configured in
      # Weblate at any given time.
      - name: Read SUPPORTED_LOCALES from app/init.py
        id: locales
        if: steps.po-check.outputs.changed == 'true'
        run: |
          languages=$(python3 -c "
          import ast, re
          src = open('app/init.py', encoding='utf-8').read()
          match = re.search(r'^SUPPORTED_LOCALES\s*=\s*(\[.*?\])', src, re.MULTILINE)
          print(','.join(ast.literal_eval(match.group(1))))
          ")
          echo "Languages: $languages"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

      - name: Run Weblate quality checks
        id: weblate
        if: steps.po-check.outputs.changed == 'true'
        uses: e2jk/weblate-checks-action@9fe6f9c428168d7a8cfcd81f841c7c6d1880c3d5 # v1.0.5
        continue-on-error: true  # a Weblate hiccup (rate limit, outage) shouldn't turn this job red
        with:
          project: openhangar
          component: openhangar
          languages: ${{ steps.locales.outputs.languages }}
          token: ${{ secrets.WEBLATE_API_TOKEN }}

      - name: Upload results to GitHub Code Scanning
        if: always() && steps.po-check.outputs.changed == 'true' && hashFiles(steps.weblate.outputs.sarif-file) != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: ${{ steps.weblate.outputs.sarif-file }}
          category: weblate-i18n
