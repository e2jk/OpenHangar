name: Auto-PR and auto-merge

# Two independent auto-merge paths, gated very differently on purpose:
#
# 1. Push to `ship` (this repo owner's own aggregated local commits, landed
#    via scripts/ship.sh) lands it on main without a human review — it's
#    already-tested work by the repo owner, so opening the PR and enabling
#    auto-merge unconditionally is enough; CI passing (via the branch
#    ruleset's required status checks) is the only real gate. Renovate's
#    own dependency-update PRs are NOT handled by this workflow at all —
#    Renovate enables auto-merge on those itself (see automerge: true in
#    renovate.json); they never reach either job here.
#
# 2. Any other pull request to main (i.e. from an external contributor)
#    additionally requires this repo's owner to submit a formal "Approve"
#    review on it -- a deliberate human sign-off on untrusted code, on top
#    of the same required-status-checks gate. That's a different action
#    from approving a first-time contributor's pending workflow runs so
#    their CI is even allowed to execute (see docs/development.md) -- both
#    are needed for one of these PRs to merge, neither alone is enough.
#
#    This path reacts to the base repo's own CI workflow finishing, not
#    directly to the review or to a later push -- deliberately, not as a
#    fallback. Two hard platform restrictions rule out reacting to the
#    review itself, both confirmed in practice (not just from docs) on
#    this repo's own PRs: a pull_request_review (or plain pull_request)
#    event tied to a fork-authored PR -- i.e. any real external
#    contribution -- gets NEITHER secrets NOR a write-scoped GITHUB_TOKEN,
#    no matter what this workflow declares (PR #262, run 35070204852:
#    PAT_AUTO_PR_MERGE came through completely empty). It also requires a
#    maintainer to click "Approve and run" in the Actions tab before the
#    job can even start -- reasonable for the untrusted CI build itself
#    (it runs the PR's own code), pointless friction for this one (it
#    never does). A polling schedule would sidestep both, but firing every
#    few minutes forever just to almost always find nothing to do isn't
#    worth the constant background noise for how rarely an external PR
#    actually needs this.
#
#    workflow_run instead: it fires when the "CI" workflow completes, runs
#    in the base repo's trusted context regardless of what triggered that
#    CI run (same guarantee pull_request_target has, and exempt from the
#    "approve to run" gate for the same reason -- it never runs code from
#    the fork, only reacts to a run that already finished), so it gets
#    full secrets/permissions with no click needed. This catches the
#    common "approve, then the contributor pushes a fix/rebase, CI reruns
#    and succeeds" sequence automatically and near-instantly, with zero
#    recurring background runs -- it only ever fires when CI genuinely
#    just finished. What it can't catch is the other ordering -- approving
#    a PR whose CI already went green earlier, with no new push
#    afterward, so no new CI completion to react to. workflow_dispatch
#    (blank pr_number = check every open external PR, same logic) is the
#    fallback for exactly that case -- run it right after approving, same
#    as already done by hand for #260/#262.
#
#    Either way, this re-verifies, for the matched PR(s), that the
#    owner-approval gate still holds AND that nothing changed in the PR
#    since that specific approval was granted (this repo's ruleset has
#    dismiss_stale_reviews_on_push: false, so an approval survives every
#    subsequent push, content-changing or not -- arming unconditionally
#    would auto-merge unreviewed new commits slipped in after approval
#    exactly as readily as a harmless rebase onto a newer main).
#
# Both paths just enable GitHub's native auto-merge and let the branch
# ruleset's required status checks decide when it's actually safe to land —
# neither path does any CI work itself, and merging still waits for CI
# (which may finish before or after the approval; auto-merge doesn't care
# about the order, only that both end up satisfied).
on:
  push:
    branches: [ship]
  workflow_run:  # zizmor: ignore[dangerous-triggers] intentional: no checkout of anything anywhere in this file, only gh api/pr calls by number/SHA -- see the comment above
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (blank = check every open external PR)'
        required: false
        type: number

permissions: read-all  # zizmor: ignore[excessive-permissions] intentional: workflow default is read-only, each job opts into exactly the write scopes it needs

concurrency:
  group: auto-pr-merge
  cancel-in-progress: false

jobs:
  auto-pr:
    name: Open PR to main and enable auto-merge
    # See path 1 in the on: comment above -- push-to-ship only; path 2 is
    # handled by the other job below instead.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # gh pr merge
      pull-requests: write  # gh pr create / gh pr merge
    steps:
      - name: Open PR (if none exists) and enable auto-merge
        env:
          # A PR authored by github-actions[bot] (i.e. opened with the
          # default GITHUB_TOKEN) now needs manual workflow-run approval on
          # every run — a GitHub-side policy change (rolled out gradually
          # May-June 2026) that applies even to same-repo, non-fork PRs
          # like this one. A PAT from a real trusted account sidesteps it:
          # the PR is then authored by that account, not the bot. Fine-
          # grained PAT scoped to just this repo, Pull requests: read/write
          # + Contents: read/write; stored as the PAT_AUTO_PR_MERGE repo
          # secret. See docs/development.md#landing-changes-on-main.
          GH_TOKEN: ${{ secrets.PAT_AUTO_PR_MERGE }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pr_number=$(gh pr list --head ship --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            title=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.commit.message' | head -1)
            gh pr create --base main --head ship --title "${title:-ship}" \
              --body "Auto-opened from \`ship\` — will merge once CI passes."
            pr_number=$(gh pr list --head ship --base main --state open --json number --jq '.[0].number')
          fi
          echo "PR #$pr_number"

          # Right after creation, GitHub hasn't always finished computing the
          # PR's mergeability yet — `gh pr merge --auto` can transiently fail
          # with "Pull request is in unstable status" (enablePullRequestAutoMerge)
          # or "Required status check ... is queued" (mergePullRequest), even
          # though retrying moments later succeeds once GitHub's backend
          # settles. Observed in practice (weblate-checks-action, twice in a
          # row), not theoretical — retry instead of failing the whole run
          # over a race condition on GitHub's side.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr_number" --auto --rebase; then
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed — retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to enable auto-merge on PR #$pr_number after 5 attempts"
          exit 1

  auto-merge-approved-prs:
    name: Enable auto-merge on approved, unchanged-since-approval external PRs
    # See path 2 in the on: comment above.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # gh pr merge
      pull-requests: write  # gh pr merge
    steps:
      - name: Check every candidate PR and arm auto-merge where it's safe
        env:
          # workflow_run and workflow_dispatch are both fully trusted
          # triggers (not tied to any fork-PR event), so unlike the
          # pull_request_review path this replaced, secrets are simply
          # available here -- no workaround needed, this is just the
          # normal case.
          GH_TOKEN: ${{ secrets.PAT_AUTO_PR_MERGE }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A single PR's failure (transient API hiccup, unexpected shape,
          # …) shouldn't stop the rest of the list from being checked.
          set +e

          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # Only the PR(s) this specific CI run was for -- narrower and
            # far cheaper than scanning every open PR on every CI
            # completion, which fires much more often than approvals do.
            # workflow_run.pull_requests is unreliable for fork PRs (often
            # empty), so match independently on head commit instead.
            prs=$(gh pr list --base main --state open --limit 100 --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$WORKFLOW_RUN_HEAD_SHA\") | .number")
          elif [ -n "$PR_NUMBER_INPUT" ]; then
            prs="$PR_NUMBER_INPUT"
          else
            prs=$(gh pr list --base main --state open --limit 100 --json number --jq '.[].number')
          fi

          for pr in $prs; do
            head_ref=$(gh pr view "$pr" --json headRefName --jq .headRefName 2>/dev/null)
            case "$head_ref" in
              ""|ship|renovate/*)
                # Empty means the PR lookup itself failed (e.g. a bad
                # manually-typed pr_number) -- skip either way, ship/renovate
                # PRs are handled by the other job / Renovate's own automerge.
                continue
                ;;
            esac

            if [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
              continue  # already armed, nothing to do
            fi

            # The latest owner-authored APPROVED review, if any, and the
            # exact commit it was submitted against -- GitHub records this
            # per review; it's not necessarily the PR's current head.
            review=$(gh api "repos/$GH_REPO/pulls/$pr/reviews" --paginate \
              --jq "[.[] | select(.user.login == \"${GITHUB_REPOSITORY_OWNER}\" and .state == \"APPROVED\")] | sort_by(.submitted_at) | last")
            if [ -z "$review" ] || [ "$review" = "null" ]; then
              continue  # not approved (yet)
            fi
            approved_sha=$(echo "$review" | jq -r .commit_id)
            head_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)

            if [ "$approved_sha" != "$head_sha" ]; then
              # Something was pushed after the approval (e.g. rebasing onto
              # a newer main via "Update branch") -- only proceed if it
              # provably didn't change the PR's own file content. Diff each
              # commit's own contribution against the SAME reference point
              # (main's current tip) with a three-dot compare, so main
              # having moved doesn't produce a false "changed": this
              # isolates each side's unique contribution, filtering out
              # whatever came from main itself, regardless of how far main
              # moved between the approval and now.
              diff_approved=$(gh api "repos/$GH_REPO/compare/${main_sha}...${approved_sha}" \
                --jq '[.files[] | {filename, sha}] | sort_by(.filename)' 2>/dev/null)
              diff_head=$(gh api "repos/$GH_REPO/compare/${main_sha}...${head_sha}" \
                --jq '[.files[] | {filename, sha}] | sort_by(.filename)' 2>/dev/null)
              # Each entry pairs a filename with its blob SHA (a content
              # hash) -- this catches any actual content change to an
              # already-touched file, not just files being added or
              # removed. Any comparison failure also falls through here,
              # failing closed -- skip arming rather than risk a false
              # "unchanged".
              if [ -z "$diff_approved" ] || [ -z "$diff_head" ] || [ "$diff_approved" != "$diff_head" ]; then
                echo "PR #$pr: content changed since the last approval (or couldn't be verified) -- leaving it for a fresh look"
                continue
              fi
            fi

            echo "PR #$pr: approved and unchanged since -- arming auto-merge"
            armed=false
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$pr" --auto --rebase; then
                armed=true
                break
              fi
              echo "PR #$pr: attempt ${attempt}/5 failed — retrying in 10s..."
              sleep 10
            done
            if [ "$armed" != "true" ]; then
              echo "::error::Failed to enable auto-merge on PR #$pr after 5 attempts"
            fi
          done
