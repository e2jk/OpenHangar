{% extends "base.html" %}

{% block title %}{{ _('AMP') }} — {{ aircraft.registration }} — OpenHangar{% endblock %}


{% block content %}
<div class="container py-4">

  <div class="amp-export-actions d-flex justify-content-end gap-2 mb-3">
    <a href="{{ url_for('maintenance.export_amp_pdf', aircraft_id=aircraft.id) }}" hx-boost="false" class="btn btn-ac-primary btn-sm">
      <i class="bi bi-file-earmark-pdf me-1"></i>{{ _('Download PDF') }}
    </a>
    <a href="{{ url_for('maintenance.list_triggers', aircraft_id=aircraft.id) }}" class="btn btn-ac-ghost btn-sm">
      <i class="bi bi-arrow-left me-1"></i>{{ _('Back') }}
    </a>
  </div>

  {% include "maintenance/_amp_export_style.html" %}
  {% include "maintenance/_amp_export_body.html" %}

</div>
{% endblock %}
