{% if group_view and count_scopes %}<div><label for="passport-count" class="form-label">{{ _('Count visits by') }}</label><select class="form-select" id="passport-count" name="count">{% for option in count_scopes %}<option value="{{ option.key }}" {% if count_scope == option.key %}selected{% endif %}>{% if option.key == 'you' %}{{ _('You') }}{% elif option.key == 'group' %}{{ _('The whole group') }}{% else %}{{ option.name }}{% endif %}</option>{% endfor %}</select></div>{% endif %}
