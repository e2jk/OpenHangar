{% set inline_auto_submit = inline_auto_submit | default(false) %}
{% if group_view and count_scopes %}<div{% if inline_auto_submit %} class="d-flex align-items-center gap-2"{% endif %}><label for="passport-count" class="form-label{% if inline_auto_submit %} mb-0{% endif %}">{{ _('Count visits by') }}</label><select class="form-select{% if inline_auto_submit %} w-auto{% endif %}" id="passport-count" name="count"{% if inline_auto_submit %} data-auto-submit{% endif %}>{% for option in count_scopes %}<option value="{{ option.key }}" {% if count_scope == option.key %}selected{% endif %}>{% if option.key == 'you' %}{{ _('You') }}{% elif option.key == 'group' %}{{ _('The whole group') }}{% else %}{{ option.name }}{% endif %}</option>{% endfor %}</select></div>{% endif %}
