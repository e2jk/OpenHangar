{% extends "base.html" %}

{% block title %}{{ _('Add wish-list item') }} — {{ aircraft.registration }} — OpenHangar{% endblock %}

{% block content %}
<div class="container py-4 oh-form-narrow">

  <div class="page-header mb-4">
    <div>
      <h1 class="page-title"><i class="bi bi-stars me-2"></i>{{ _('Add wish-list item') }}</h1>
      <p class="page-sub"><span class="oh-reg-plate">{{ aircraft.registration }}</span></p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="title" class="form-label fw-medium">{{ _('Item') }}</label>
          <input type="text" class="form-control" id="title" name="title"
                 placeholder="{{ _('e.g. ADS-B Out transponder upgrade') }}" required>
        </div>

        <div class="mb-3">
          <label for="rough_cost" class="form-label fw-medium">{{ _('Rough cost') }} <span class="text-muted fw-normal">({{ _('optional') }})</span></label>
          <input type="number" step="0.01" min="0" class="form-control" id="rough_cost" name="rough_cost">
        </div>

        <div class="mb-3">
          <label for="requirements" class="form-label fw-medium">{{ _('What installing it would require') }} <span class="text-muted fw-normal">({{ _('optional') }})</span></label>
          <textarea class="form-control" id="requirements" name="requirements" rows="2"
                    placeholder="{{ _('e.g. downtime, panel space, an STC') }}"></textarea>
        </div>

        <div class="mb-3">
          <label for="notes" class="form-label fw-medium">{{ _('Notes') }} <span class="text-muted fw-normal">({{ _('optional') }})</span></label>
          <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">{{ _('Add') }}</button>
          <a href="{{ url_for('airworthiness.equipment_board', aircraft_id=aircraft.id) }}"
             class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
